services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: mecanica
      POSTGRES_USER: mecanica
      POSTGRES_PASSWORD: mecanica
    volumes:
      - mecanica_db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mecanica -d mecanica"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/mecanica
      SPRING_DATASOURCE_USERNAME: mecanica
      SPRING_DATASOURCE_PASSWORD: mecanica
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      APP_ADMIN_USERNAME: admin
      APP_ADMIN_PASSWORD: admin123
      CORS_ALLOWED_ORIGINS: http://localhost:5173
    ports:
      - "8080:8080"

volumes:
  mecanica_db_data:
