apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: mecanica
data:
  SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/mecanica
  SPRING_JPA_HIBERNATE_DDL_AUTO: update
  APP_ADMIN_USERNAME: admin
  CORS_ALLOWED_ORIGINS: "http://localhost:8080"
---
apiVersion: v1
kind: Secret
metadata:
  name: backend-secret
  namespace: mecanica
type: Opaque
stringData:
  SPRING_DATASOURCE_USERNAME: mecanica
  SPRING_DATASOURCE_PASSWORD: mecanica-k8s-2026
  APP_ADMIN_PASSWORD: admin123
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: mecanica
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z postgres 5432; do echo aguardando postgres...; sleep 2; done"]
      containers:
        - name: backend
          image: mecanica-backend:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: backend-config
            - secretRef:
                name: backend-secret
          env:
            - name: JAVA_TOOL_OPTIONS
              value: "-XX:TieredStopAtLevel=1 -XX:+UseSerialGC -XX:MaxRAMPercentage=70"
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            periodSeconds: 5
            failureThreshold: 120
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            periodSeconds: 15
          resources:
            requests:
              cpu: 200m
              memory: 384Mi
            limits:
              memory: 640Mi
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: mecanica
spec:
  type: ClusterIP
  selector:
    app: backend
  ports:
    - port: 8080
      targetPort: 8080
