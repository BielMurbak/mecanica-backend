server:
  port: ${PORT:8080}

spring:
  application:
    name: mecanica-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/mecanica}
    username: ${SPRING_DATASOURCE_USERNAME:mecanica}
    password: ${SPRING_DATASOURCE_PASSWORD:mecanica}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

app:
  seed:
    admin-username: ${APP_ADMIN_USERNAME:admin}
    admin-password: ${APP_ADMIN_PASSWORD:admin123}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
