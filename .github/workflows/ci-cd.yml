name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/bielmurbak/mecanica-backend

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build + testes (mvn verify)
        run: mvn -B verify

      - name: Analise estatica (SpotBugs, nao bloqueante)
        continue-on-error: true
        run: mvn -B com.github.spotbugs:spotbugs-maven-plugin:4.8.6.6:check

      - name: Upload do artefato (jar)
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/app.jar

  docker-build-push:
    name: Build & Push da imagem Docker
    needs: build-and-test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Configurar Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e push da imagem
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

  deploy:
    name: Deploy na EC2
    needs: docker-build-push
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Atualizar codigo e reiniciar o container da app
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            set -e
            cd /home/ubuntu/mecanica-backend
            git fetch origin main
            git reset --hard origin/main
            docker compose pull app
            docker compose up -d app
            docker image prune -f

      - name: Validar sucesso do deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            for i in $(seq 1 10); do
              code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/auth/login || echo 000)
              if [ "$code" != "000" ]; then
                echo "App respondeu HTTP $code - deploy OK"
                exit 0
              fi
              echo "Tentativa $i: app ainda nao respondeu, aguardando..."
              sleep 3
            done
            echo "Deploy FALHOU: app nao respondeu apos ~30s"
            exit 1
